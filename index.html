<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Penalty Arena</title>
<script type="text/javascript" src="https://gc.kis.v2.scr.kaspersky-labs.com/FD126C42-EBFA-4E12-B309-BB3FDD723AC1/main.js?attr=TGiViQlKLXn-5R6hMbXLcRAKmydQId6Afh6wQJ5_67TyeOy8R-QqLg7houlwErOfLHgwCnE4qoivSK-_237i-fsf5aQT3AdZyUlUrkyO8sStbl8g6_XKHMcnMZDHHFSZGP9W6RJDuoZjUh1q2Q2Fq6ihAnZwXSsCbkYw1_dCK36HY2Sk-cg6k8pVz7zLELUKCsaarvBZTegJPBBQ3NOG5wilxD7xs1PmmB0DggywCMgB6grK-HB0_ZCbA4ofS6flknho2uvNKV-7VpblarimjpL3W_cKz3roqtA36wzndBnhs8ksJL2O7QeIagYTpA3d" charset="UTF-8"></script><link rel="stylesheet" crossorigin="anonymous" href="https://gc.kis.v2.scr.kaspersky-labs.com/E3E8934C-235A-4B0E-825A-35A08381A191/abn/main.css?attr=aHR0cHM6Ly9jaGF0Z3B0LmNvbS9iYWNrZW5kLWFwaS9lc3R1YXJ5L2NvbnRlbnQ_aWQ9ZmlsZV8wMDAwMDAwMDkyODA4MWY3OGVlYTE5ZTEyNTVlYzU1ZSZmbj1pbmRleC5odG1sJmNkPWF0dGFjaG1lbnQmdHM9NDk2OTk4JnA9ZnMmY2lkPTEmc2lnPTY0NDg2MTZhNjVmZWZmZjRjMWU0YmE2MTI5ZDgyZGM3ZDM4ZmQ0ZjNiZGY3NjRkMDA4MmMzNGZlMjE1N2IxNjgmdj0w"/><style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#050b12;font-family:Arial;color:white}canvas{display:block;width:100vw;height:100vh}
#top{position:fixed;top:18px;left:50%;transform:translateX(-50%);display:flex;gap:12px;z-index:5}.box{background:rgba(4,12,22,.78);border:1px solid rgba(255,255,255,.2);padding:9px 18px;border-radius:10px;text-align:center;min-width:95px}.box small{display:block;color:#9fb0bf}.box b{font-size:22px}
#brand{position:fixed;left:20px;top:20px;font-weight:900;font-size:22px;z-index:5;text-shadow:0 2px 8px #000}#tip{position:fixed;bottom:18px;width:100%;text-align:center;font-weight:bold;text-shadow:0 2px 6px #000;z-index:5}
#message{position:fixed;left:50%;top:55%;transform:translate(-50%,-50%);font-size:clamp(32px,7vw,72px);font-weight:900;text-shadow:0 5px 15px #000;z-index:6}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:10}.panel{background:linear-gradient(145deg,#0b1c2c,#05090f);border:1px solid #ffffff33;border-radius:22px;padding:32px;text-align:center;width:min(90vw,480px);box-shadow:0 25px 70px #000}.panel h1{font-size:44px;margin:0 0 10px}.panel p{line-height:1.5;color:#c8d3dc}button{background:#f2c94c;border:0;padding:15px 28px;border-radius:10px;font-size:18px;font-weight:bold;cursor:pointer}
</style></head><body>
<canvas id="c"></canvas><div id="brand">⚽ PENALTY ARENA</div>
<div id="top"><div class="box"><small>GOALS</small><b id="g">0</b></div><div class="box"><small>SHOTS</small><b id="s">0 / 5</b></div><div class="box"><small>BEST</small><b id="b">0</b></div></div>
<div id="message"></div><div id="tip">🎯 TAP / CLICK INSIDE THE GOAL TO AIM YOUR PENALTY</div>
<div id="overlay"><div class="panel" id="panel"><h1>⚽ PENALTY ARENA</h1><p>A realistic-style stadium penalty challenge.<br><b>Aim for the corners and beat the goalkeeper!</b></p><button onclick="begin()">KICK OFF 🔥</button></div></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');let W,H,goals=0,shots=0,best=+localStorage.realPenaltyBest||0,play=false,ball=null,kx=0,kv=2,msg='',mt=0;document.getElementById('b').textContent=best;
function rs(){W=c.width=innerWidth;H=c.height=innerHeight}addEventListener('resize',rs);rs();
function goal(){let w=Math.min(W*.78,850),h=H*.42;return{x:(W-w)/2,y:H*.16,w,h}}
function begin(){goals=shots=0;ball=null;play=true;document.getElementById('g').textContent=0;document.getElementById('s').textContent='0 / 5';document.getElementById('overlay').style.display='none';}
function stadium(){
let sky=x.createLinearGradient(0,0,0,H*.52);sky.addColorStop(0,'#07172b');sky.addColorStop(1,'#3b6684');x.fillStyle=sky;x.fillRect(0,0,W,H*.55);
for(let row=0;row<7;row++){x.fillStyle=`rgba(${30+row*5},${35+row*7},${45+row*8},1)`;x.fillRect(0,H*.03+row*H*.055,W,H*.06)}
for(let i=0;i<180;i++){let px=(i*73)%W,py=H*.05+(i*47)%(H*.34);x.fillStyle=i%3?'#d9d9d9':'#f2c94c';x.fillRect(px,py,2,2)}
x.fillStyle='#1e8f42';x.fillRect(0,H*.45,W,H*.55);for(let i=0;i<12;i++){x.fillStyle=i%2?'rgba(255,255,255,.035)':'rgba(0,0,0,.025)';x.fillRect(i*W/12,H*.45,W/12,H)}
}
function drawGoal(){
let g=goal();x.fillStyle='rgba(220,235,245,.16)';x.fillRect(g.x,g.y,g.w,g.h);
x.strokeStyle='rgba(255,255,255,.28)';x.lineWidth=1;
for(let i=0;i<18;i++){let xx=g.x+i*g.w/17;x.beginPath();x.moveTo(xx,g.y);x.lineTo(xx,g.y+g.h);x.stroke()}
for(let i=0;i<9;i++){let yy=g.y+i*g.h/8;x.beginPath();x.moveTo(g.x,yy);x.lineTo(g.x+g.w,yy);x.stroke()}
x.strokeStyle='#fff';x.lineWidth=Math.max(5,W*.006);x.strokeRect(g.x,g.y,g.w,g.h);
}
function keeper(){
let g=goal();kx+=kv;if(kx>g.w*.3||kx<-g.w*.3)kv*=-1;let X=W/2+kx,Y=g.y+g.h*.57;
x.save();x.translate(X,Y);x.fillStyle='#143d8c';x.fillRect(-24,-34,48,50);x.fillStyle='#f0b58d';x.beginPath();x.arc(0,-49,15,0,7);x.fill();x.strokeStyle='#143d8c';x.lineWidth=12;x.beginPath();x.moveTo(-22,-25);x.lineTo(-58,-5);x.moveTo(22,-25);x.lineTo(58,-5);x.stroke();x.strokeStyle='#111';x.lineWidth=14;x.beginPath();x.moveTo(-13,14);x.lineTo(-18,56);x.moveTo(13,14);x.lineTo(18,56);x.stroke();x.restore();return{X,Y}
}
function drawBall(){
if(!ball)return;ball.p+=.035;let p=Math.min(ball.p,1),e=1-Math.pow(1-p,3);ball.X=W/2+(ball.tx-W/2)*e;ball.Y=H*.83+(ball.ty-H*.83)*e;ball.r=32*(1-.6*e);
x.beginPath();x.arc(ball.X,ball.Y,ball.r,0,7);x.fillStyle='#fff';x.fill();x.strokeStyle='#bbb';x.lineWidth=2;x.stroke();x.fillStyle='#202020';x.beginPath();x.arc(ball.X,ball.Y,ball.r*.3,0,7);x.fill();
if(p>=1){let g=goal(),save=Math.abs(ball.tx-(W/2+kx))<65&&ball.ty>g.y+g.h*.25&&ball.ty<g.y+g.h*.82;if(save){msg='SAVED! 🧤'}else{goals++;document.getElementById('g').textContent=goals;msg='GOOOAL! ⚽🔥'}mt=70;ball=null;if(shots>=5)setTimeout(end,800)}
}
function end(){play=false;if(goals>best){best=goals;localStorage.realPenaltyBest=best}document.getElementById('b').textContent=best;document.getElementById('overlay').style.display='flex';document.getElementById('panel').innerHTML=`<h1>🏆 FINAL SCORE</h1><p>You scored <b>${goals} / 5</b> penalties!</p><button onclick="begin()">PLAY AGAIN 🔥</button>`}
function loop(){requestAnimationFrame(loop);stadium();drawGoal();keeper();drawBall();if(mt>0){mt--;document.getElementById('message').textContent=msg}else document.getElementById('message').textContent=''}loop();
c.addEventListener('pointerdown',e=>{if(!play||ball)return;let g=goal(),X=e.clientX,Y=e.clientY;if(X>=g.x&&X<=g.x+g.w&&Y>=g.y&&Y<=g.y+g.h){shots++;document.getElementById('s').textContent=shots+' / 5';ball={tx:X,ty:Y,p:0}}});
</script></body></html>
