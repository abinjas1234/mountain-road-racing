<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

html,body{margin:0;height:100%;overflow:hidden;background:#55bde6;font-family:Arial;color:#fff}canvas{display:block}
#hud{position:fixed;top:14px;left:14px;z-index:5;background:#07131bdd;border-radius:14px;padding:13px 17px;line-height:1.6}
#hud b{color:#ffd54a;font-size:20px}#help{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);z-index:5;background:#000b;padding:10px 18px;border-radius:20px;text-align:center}
#mini{position:fixed;right:18px;top:18px;width:150px;height:150px;border:3px solid white;border-radius:50%;background:#24613c;z-index:5}
#start{position:fixed;inset:0;background:#07131be8;display:flex;align-items:center;justify-content:center;z-index:10;text-align:center}.card{padding:32px;background:#102b3f;border-radius:24px;max-width:480px;margin:20px}.card h1{font-size:50px;color:#ffd54a;margin:0}button{padding:15px 28px;border:0;border-radius:12px;background:#ffd54a;font-size:18px;font-weight:bold}
</style></head><body>
<canvas id="game"></canvas><canvas id="mini"></canvas>
<div id="hud"><b>🌴 PALM CITY</b><br>💰 CASH: $<span id="cash">0</span><br>🚗 MODE: <span id="mode">WALKING</span><br>📍 MAP: OPEN WORLD</div>
<div id="help">WASD / Arrow Keys: Move • Go near a car + press E to enter • E again to exit</div>
<div id="start"><div class="card"><h1>🌴 PALM CITY</h1><p>Explore a huge city. Walk around and drive cars!</p><button onclick="startGame()">ENTER CITY 🚗</button></div></div>
<script>
const c=document.getElementById('game'),ctx=c.getContext('2d'),mini=document.getElementById('mini'),mx=mini.getContext('2d');
let W,H;function resize(){W=c.width=innerWidth;H=c.height=innerHeight}addEventListener('resize',resize);resize();
const WORLD={w:6000,h:4500};let running=false,cash=0,keys={},cam={x:0,y:0};
const player={x:3000,y:2250,r:14,car:null};
const cars=[
{x:2850,y:2250,color:'#e63946',a:0,s:0},{x:3400,y:1800,color:'#1976d2',a:0,s:0},
{x:1700,y:3000,color:'#ff9800',a:0,s:0},{x:4400,y:2800,color:'#eeeeee',a:0,s:0},
{x:900,y:1000,color:'#8e44ad',a:0,s:0},{x:5200,y:3800,color:'#16a085',a:0,s:0}
];
const coins=[];for(let i=0;i<90;i++)coins.push({x:100+Math.random()*(WORLD.w-200),y:100+Math.random()*(WORLD.h-200)});
const buildings=[];for(let i=0;i<120;i++)buildings.push({x:Math.random()*WORLD.w,y:Math.random()*WORLD.h,w:100+Math.random()*180,h:90+Math.random()*170});
const palms=[];for(let i=0;i<250;i++)palms.push({x:Math.random()*WORLD.w,y:Math.random()*WORLD.h});

addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='e')toggleCar()});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function startGame(){running=true;document.getElementById('start').style.display='none'}
function toggleCar(){
if(!running)return;
if(player.car){player.x=player.car.x+60;player.y=player.car.y;player.car=null;document.getElementById('mode').textContent='WALKING';return}
let near=cars.find(q=>Math.hypot(player.x-q.x,player.y-q.y)<70);
if(near){player.car=near;document.getElementById('mode').textContent='DRIVING'}}
function update(){
if(!running)return;let L=keys.a||keys.arrowleft,R=keys.d||keys.arrowright,U=keys.w||keys.arrowup,D=keys.s||keys.arrowdown;
if(player.car){let q=player.car;if(L)q.a-=.06;if(R)q.a+=.06;if(U)q.s=Math.min(q.s+.28,10);else if(D)q.s=Math.max(q.s-.4,-4);else q.s*=.96;q.x+=Math.cos(q.a)*q.s;q.y+=Math.sin(q.a)*q.s;player.x=q.x;player.y=q.y}
else{let dx=(R?1:0)-(L?1:0),dy=(D?1:0)-(U?1:0);if(dx||dy){let z=Math.hypot(dx,dy);player.x+=dx/z*5;player.y+=dy/z*5}}
player.x=Math.max(20,Math.min(WORLD.w-20,player.x));player.y=Math.max(20,Math.min(WORLD.h-20,player.y));
for(let i=coins.length-1;i>=0;i--)if(Math.hypot(player.x-coins[i].x,player.y-coins[i].y)<30){coins.splice(i,1);cash+=100;document.getElementById('cash').textContent=cash}
cam.x=player.x-W/2;cam.y=player.y-H/2;cam.x=Math.max(0,Math.min(WORLD.w-W,cam.x));cam.y=Math.max(0,Math.min(WORLD.h-H,cam.y));
}
function visible(X,Y,pad=100){return X>-pad&&Y>-pad&&X<W+pad&&Y<H+pad}
function road(x,y,w,h){let X=x-cam.x,Y=y-cam.y;ctx.fillStyle='#4d5359';ctx.fillRect(X,Y,w,h);ctx.strokeStyle='#f2d36b';ctx.lineWidth=4;ctx.setLineDash([22,18]);ctx.beginPath();if(w>h){ctx.moveTo(X,Y+h/2);ctx.lineTo(X+w,Y+h/2)}else{ctx.moveTo(X+w/2,Y);ctx.lineTo(X+w/2,Y+h)}ctx.stroke();ctx.setLineDash([])}
function building(b){let X=b.x-cam.x,Y=b.y-cam.y;if(!visible(X,Y,200))return;ctx.fillStyle='#d6cec0';ctx.fillRect(X,Y,b.w,b.h);ctx.fillStyle='#72b5d4';for(let y=Y+12;y<Y+b.h-10;y+=25)for(let x=X+12;x<X+b.w-10;x+=26)ctx.fillRect(x,y,10,12)}
function palm(p){let X=p.x-cam.x,Y=p.y-cam.y;if(!visible(X,Y,80))return;ctx.fillStyle='#704321';ctx.fillRect(X-5,Y,10,42);ctx.fillStyle='#278a4b';for(let i=0;i<6;i++){ctx.save();ctx.translate(X,Y);ctx.rotate(i*Math.PI/3);ctx.fillRect(0,-5,42,10);ctx.restore()}}
function drawCar(q){let X=q.x-cam.x,Y=q.y-cam.y;if(!visible(X,Y))return;ctx.save();ctx.translate(X,Y);ctx.rotate(q.a);ctx.fillStyle='rgba(0,0,0,.3)';ctx.fillRect(-30,-12,65,35);ctx.fillStyle=q.color;ctx.beginPath();ctx.roundRect(-32,-18,64,36,8);ctx.fill();ctx.fillStyle='#bde9ff';ctx.fillRect(-10,-13,20,26);ctx.fillStyle='#111';ctx.fillRect(-25,-22,12,5);ctx.fillRect(13,-22,12,5);ctx.fillRect(-25,17,12,5);ctx.fillRect(13,17,12,5);ctx.restore()}
function draw(){
ctx.fillStyle='#66c9ed';ctx.fillRect(0,0,W,H);ctx.fillStyle='#54a84e';ctx.fillRect(0,0,W,H);
for(let y=400;y<WORLD.h;y+=850)road(0,y,WORLD.w,150);
for(let x=500;x<WORLD.w;x+=900)road(x,0,160,WORLD.h);
buildings.forEach(building);palms.forEach(palm);
coins.forEach(q=>{let X=q.x-cam.x,Y=q.y-cam.y;if(visible(X,Y)){ctx.fillStyle='#ffd43b';ctx.beginPath();ctx.arc(X,Y,9,0,Math.PI*2);ctx.fill()}});
cars.forEach(drawCar);
if(!player.car){let X=player.x-cam.x,Y=player.y-cam.y;ctx.fillStyle='#26313b';ctx.fillRect(X-8,Y-3,16,25);ctx.fillStyle='#efb18b';ctx.beginPath();ctx.arc(X,Y-13,10,0,Math.PI*2);ctx.fill()}
}
function drawMini(){mini.width=mini.clientWidth;mini.height=mini.clientHeight;let s=mini.width/WORLD.w;mx.fillStyle='#39894b';mx.fillRect(0,0,mini.width,mini.height);mx.fillStyle='#555';for(let y=400;y<WORLD.h;y+=850)mx.fillRect(0,y*s,mini.width,150*s);for(let x=500;x<WORLD.w;x+=900)mx.fillRect(x*s,0,160*s,mini.height);mx.fillStyle='#fff';mx.beginPath();mx.arc(player.x*s,player.y*s,4,0,Math.PI*2);mx.fill()}
function loop(){update();draw();drawMini();requestAnimationFrame(loop)}loop();
</script></body></html>
